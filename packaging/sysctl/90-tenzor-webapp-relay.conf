# WebApp relay public listener capacity. The Rust process explicitly calls
# listen(8192), but Linux clamps it to net.core.somaxconn.
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_syncookies = 1

# Reap closed burst traffic quickly without recycling TIME-WAIT tuples.
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 2
